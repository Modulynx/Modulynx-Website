    <path d="M62 40 L58 82 L80 62 Z" fill="#070a10" opacity=".85" stroke="url(#edgeGrad)" stroke-width="1"/>
    <path d="M178 40 L182 82 L160 62 Z" fill="#070a10" opacity=".85" stroke="url(#edgeGrad)" stroke-width="1"/>
    <g stroke="url(#edgeGrad)" stroke-width="1.2" fill="none" opacity=".9">
      <path d="M120 52 L120 90"/>
      <path d="M86 64 L104 96 L120 90 L136 96 L154 64"/>
      <path d="M53 90 L74 104 L104 96"/>
      <path d="M187 90 L166 104 L136 96"/>
      <path d="M43 128 L74 128 L74 104"/>
      <path d="M197 128 L166 128 L166 104"/>
      <path d="M58 167 L86 152 L74 128"/>
      <path d="M182 167 L154 152 L166 128"/>
      <path d="M86 152 L104 168 L120 158 L136 168 L154 152"/>
      <path d="M105 203 L104 168 M135 203 L136 168"/>
    </g>
    <path d="M67 95 L90 93 L105 104" stroke="#f2a83b" stroke-width="1.8" fill="none" opacity=".85" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M173 95 L150 93 L135 104" stroke="#f2a83b" stroke-width="1.8" fill="none" opacity=".85" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#eyeGlow)">
      <path d="M70 114 Q 88 102 106 114 Q 88 125 70 114 Z" fill="#f2ede0" stroke="url(#edgeGrad)" stroke-width="1"/>
      <ellipse cx="88" cy="113" rx="9" ry="5" fill="url(#irisGrad)"/>
      <ellipse cx="88" cy="113" rx="3" ry="4" fill="#0a0c10"/>
      <circle cx="84" cy="109" r="2.2" fill="#fff6df" opacity=".9"/>
      <path d="M70 114 Q 88 102 106 114 Q 88 109 70 114 Z" fill="#0e1420" stroke="url(#edgeGrad)" stroke-width=".8" opacity=".92"/>
      <path d="M134 114 Q 152 102 170 114 Q 152 125 134 114 Z" fill="#f2ede0" stroke="url(#edgeGrad)" stroke-width="1"/>
      <ellipse cx="152" cy="113" rx="9" ry="5" fill="url(#irisGrad)"/>
      <ellipse cx="152" cy="113" rx="3" ry="4" fill="#0a0c10"/>
      <circle cx="148" cy="109" r="2.2" fill="#fff6df" opacity=".9"/>
      <path d="M134 114 Q 152 102 170 114 Q 152 109 134 114 Z" fill="#0e1420" stroke="url(#edgeGrad)" stroke-width=".8" opacity=".92"/>
    </g>
    <path d="M107 114 Q 100 130 92 147" stroke="url(#edgeGrad)" stroke-width="1.3" fill="none" opacity=".85" stroke-linecap="round"/>
    <path d="M133 114 Q 140 130 148 147" stroke="url(#edgeGrad)" stroke-width="1.3" fill="none" opacity=".85" stroke-linecap="round"/>
    <path d="M112 150 L128 150 L120 162 Z" fill="#f2a83b" opacity=".9" stroke="url(#edgeGrad)" stroke-width="1"/>
    <path d="M120 162 L120 172 M120 172 Q 112 180 104 176 M120 172 Q 128 180 136 176"
          stroke="url(#edgeGrad)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <g stroke="#8fc7dd" stroke-width="1.1" opacity=".55" fill="none" stroke-linecap="round">
      <path d="M96 160 L78 156 L58 150"/>
      <path d="M98 168 L80 169 L64 166"/>
      <path d="M144 160 L162 156 L182 150"/>
      <path d="M142 168 L160 169 L176 166"/>
    </g>
  </g>

  <!-- wordmark + tagline — shifted clear of the square logo's overlap zone (bottom-left) -->
  <text x="272" y="85" font-family="'Space Grotesk','Segoe UI',sans-serif" font-weight="700"
        font-size="40" letter-spacing="1" fill="#e9e6df">MODU<tspan fill="#f2a83b">LYNX</tspan></text>
  <text x="274" y="112" font-family="'Space Grotesk','Segoe UI',sans-serif" font-weight="500"
        font-size="13" letter-spacing="2.5" fill="#8fc7dd">MODULAR DIGITAL STUDIO</text>
  <text x="274" y="138" font-family="'Inter','Segoe UI',sans-serif" font-size="13" fill="#9aa3b2">Built with the eyes of a lynx.</text>
</svg>
