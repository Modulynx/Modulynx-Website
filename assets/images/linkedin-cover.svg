<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <radialGradient id="bgGrad" cx=".78" cy=".4" r=".9">
      <stop offset="0" stop-color="#141b2b"/>
      <stop offset=".55" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2635"/>
      <stop offset=".55" stop-color="#121826"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a83b"/>
      <stop offset=".5" stop-color="#8fc7dd"/>
      <stop offset="1" stop-color="#f2a83b"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#f2e8a8"/>
      <stop offset=".45" stop-color="#c3ca4f"/>
      <stop offset="1" stop-color="#7a8a1a"/>
    </radialGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f2a83b" stop-opacity=".3"/>
      <stop offset=".7" stop-color="#f2a83b" stop-opacity=".06"/>
      <stop offset="1" stop-color="#f2a83b" stop-opacity="0"/>
    </radialGradient>
    <filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1128" height="191" fill="url(#bgGrad)"/>

  <!-- ambient dust -->
  <g fill="#f2a83b">
    <circle cx="60" cy="30" r="1.6" opacity=".3"/>
    <circle cx="140" cy="160" r="1.4" opacity=".25"/>
  </g>
  <g fill="#8fc7dd">
    <circle cx="1000" cy="25" r="1.6" opacity=".28"/>
    <circle cx="1080" cy="150" r="1.4" opacity=".24"/>
  </g>

  <!-- amber aura behind the lynx -->
  <circle cx="965" cy="96" r="150" fill="url(#aura)"/>

  <!-- lynx, scaled to fit the 191px band -->
  <g transform="translate(872 -2) scale(0.82)">
    <g stroke="url(#edgeGrad)" stroke-width="1.6" opacity=".85" fill="none" stroke-linecap="round">
      <path d="M57 26 L46 3"/>
      <path d="M57 26 L53 -7"/>
      <path d="M57 26 L60 -10"/>
    </g>
    <g stroke="url(#edgeGrad)" stroke-width="1.6" opacity=".85" fill="none" stroke-linecap="round">
      <path d="M183 26 L194 3"/>
      <path d="M183 26 L187 -7"/>
      <path d="M183 26 L180 -10"/>
    </g>
    <path d="M120 52 C 106 53, 95 57, 86 64 L 57 26 L 53 90 C 45 103, 41 115, 43 128
             L 25 141 L 47 148 L 33 166 L 58 167 C 67 184, 85 197, 105 203
             C 111 207, 115 209, 120 209 C 125 209, 129 207, 135 203
             C 155 197, 173 184, 182 167 L 207 166 L 193 148 L 215 141 L 197 128
