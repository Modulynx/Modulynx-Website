<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 240 230" width="240" height="230">
  <defs>
    <linearGradient id="furGrad" gradientUnits="userSpaceOnUse" x1="120" y1="-20" x2="120" y2="210">
      <stop offset="0" stop-color="#1d2635"/>
      <stop offset=".55" stop-color="#121826"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <!-- userSpaceOnUse so the neon edge gradient flows continuously across
         every shape instead of restarting per path -->
    <linearGradient id="edgeGrad" gradientUnits="userSpaceOnUse" x1="10" y1="-20" x2="230" y2="210">
      <stop offset="0" stop-color="#f2a83b"/>
      <stop offset=".5" stop-color="#8fc7dd"/>
      <stop offset="1" stop-color="#f2a83b"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#f2e8a8"/>
      <stop offset=".45" stop-color="#c3ca4f"/>
      <stop offset="1" stop-color="#7a8a1a"/>
    </radialGradient>
    <filter id="eyeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ear tufts: three short wisps, anchored right at the ear's tip vertex -->
  <g stroke="url(#edgeGrad)" stroke-width="1.3" opacity=".85" fill="none" stroke-linecap="round">
    <path d="M57 26 L46 3"/>
    <path d="M57 26 L53 -7"/>
    <path d="M57 26 L60 -10"/>
  </g>
  <g stroke="url(#edgeGrad)" stroke-width="1.3" opacity=".85" fill="none" stroke-linecap="round">
    <path d="M183 26 L194 3"/>
    <path d="M183 26 L187 -7"/>
    <path d="M183 26 L180 -10"/>
  </g>

  <!-- silhouette -->
  <path d="
    M120 52
    C 106 53, 95 57, 86 64
    L 57 26
    L 53 90
    C 45 103, 41 115, 43 128
    L 25 141 L 47 148 L 33 166 L 58 167
    C 67 184, 85 197, 105 203
    C 111 207, 115 209, 120 209
    C 125 209, 129 207, 135 203
    C 155 197, 173 184, 182 167
    L 207 166 L 193 148 L 215 141 L 197 128
    C 199 115, 195 103, 187 90
    L 183 26
    L 154 64
    C 145 57, 134 53, 120 52 Z"
    fill="url(#furGrad)" stroke="url(#edgeGrad)" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- inner ear shading, framed like every other feature -->
  <path d="M62 40 L58 82 L80 62 Z" fill="#070a10" opacity=".85" stroke="url(#edgeGrad)" stroke-width="1"/>
  <path d="M178 40 L182 82 L160 62 Z" fill="#070a10" opacity=".85" stroke="url(#edgeGrad)" stroke-width="1"/>

  <!-- facet lines -->
  <g stroke="url(#edgeGrad)" stroke-width="1.3" fill="none" opacity=".9">
    <path d="M120 52 L120 90"/>
    <path d="M86 64 L104 96 L120 90 L136 96 L154 64"/>
    <path d="M53 90 L74 104 L104 96"/>
    <path d="M187 90 L166 104 L136 96"/>
    <path d="M43 128 L74 128 L74 104"/>
    <path d="M197 128 L166 128 L166 104"/>
    <path d="M58 167 L86 152 L74 128"/>
    <path d="M182 167 L154 152 L166 128"/>
    <path d="M86 152 L104 168 L120 158 L136 168 L154 152"/>
    <path d="M105 203 L104 168 M135 203 L136 168"/>
  </g>

  <!-- brows: angled rather than a soft arch — a sharp break partway along
       each brow, sloping down toward the nose, for the same fierce,
       predatory resting expression as the hero mark -->
  <path d="M67 95 L90 93 L105 104" stroke="#f2a83b" stroke-width="1.8" fill="none" opacity=".85" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M173 95 L150 93 L135 104" stroke="#f2a83b" stroke-width="1.8" fill="none" opacity=".85" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- eyes — sharp asymmetric almond, small contained pupil, permanent
       hooded upper lid for a sharper, more dominant look -->
  <g filter="url(#eyeGlow)">
    <path d="M65 113 Q 88 97 109 112 Q 90 122 65 113 Z" fill="#f2ede0" stroke="url(#edgeGrad)" stroke-width="1"/>
    <ellipse cx="88" cy="110.5" rx="6.5" ry="5.5" fill="url(#irisGrad)"/>
    <ellipse cx="88" cy="111" rx="2.2" ry="5" fill="#0a0c10"/>
    <circle cx="84" cy="107" r="1.3" fill="#fff6df" opacity=".9"/>
    <path d="M65 113 Q 88 97 109 112 Q 90 108 65 113 Z" fill="#0e1420" stroke="url(#edgeGrad)" stroke-width=".8" opacity=".92"/>

    <path d="M175 113 Q 152 97 131 112 Q 150 122 175 113 Z" fill="#f2ede0" stroke="url(#edgeGrad)" stroke-width="1"/>
    <ellipse cx="152" cy="110.5" rx="6.5" ry="5.5" fill="url(#irisGrad)"/>
    <ellipse cx="152" cy="111" rx="2.2" ry="5" fill="#0a0c10"/>
    <circle cx="156" cy="107" r="1.3" fill="#fff6df" opacity=".9"/>
    <path d="M175 113 Q 152 97 131 112 Q 150 108 175 113 Z" fill="#0e1420" stroke="url(#edgeGrad)" stroke-width=".8" opacity=".92"/>
  </g>

  <!-- tear-stripe facial markings, a real lynx feature -->
  <path d="M107 114 Q 100 130 92 147" stroke="url(#edgeGrad)" stroke-width="1.3" fill="none" opacity=".85" stroke-linecap="round"/>
  <path d="M133 114 Q 140 130 148 147" stroke="url(#edgeGrad)" stroke-width="1.3" fill="none" opacity=".85" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M112 150 L128 150 L120 162 Z" fill="#f2a83b" opacity=".9" stroke="url(#edgeGrad)" stroke-width="1"/>

  <!-- mouth: closed, matching the mark's neutral resting expression -->
  <path d="M120 162 L120 172 M120 172 Q 112 180 104 176 M120 172 Q 128 180 136 176"
        stroke="url(#edgeGrad)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- whiskers: straight angular segments matching the low-poly language -->
  <g stroke="#8fc7dd" stroke-width="1" opacity=".55" fill="none" stroke-linecap="round">
    <path d="M96 160 L78 156 L58 150"/>
    <path d="M98 168 L80 169 L64 166"/>
    <path d="M144 160 L162 156 L182 150"/>
    <path d="M142 168 L160 169 L176 166"/>
  </g>
</svg>
